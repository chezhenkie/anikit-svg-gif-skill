[package]
name = "anikit-render-raster"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Image decoding, animation extraction, fit, Ken Burns, crossfade and pixel adjustments"

[dependencies]
anikit-core.workspace = true
anikit-time.workspace = true
anikit-tween.workspace = true
# Decoders are a large correctness surface; these crates are pure Rust and
# build into the static binary (09, row 18).
image = { version = "0.25", default-features = false, features = [
    "bmp",
    "gif",
    "jpeg",
    "png",
    "tiff",
    "webp",
] }
kamadak-exif = "0.6"
# APNG frame reading and PNG frame writing for the extract route (09, row 24).
png = "0.18.1"
# The extract timing manifest (09, row 24).
serde_json = "1"

[dev-dependencies]
# Independent decoder for the slideshow tests; not part of the binary.
gif = "0.14"
