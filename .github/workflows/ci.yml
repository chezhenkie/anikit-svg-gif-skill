name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt --target x86_64-unknown-linux-musl
      - name: format
        run: cargo fmt --manifest-path rust/Cargo.toml --check
      - name: lint
        run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --manifest-path rust/Cargo.toml --workspace
      - name: musl build
        run: cargo build --manifest-path rust/Cargo.toml --release --target x86_64-unknown-linux-musl -p anikit-cli
      - name: routes
        run: python3 e2e-smoke-tests/smoke.py rust/target/x86_64-unknown-linux-musl/release/anikit --out "$RUNNER_TEMP/smoke"
      - name: static link
        run: file rust/target/x86_64-unknown-linux-musl/release/anikit | grep -Eq "statically linked|static-pie linked"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: toolchain
        run: rustup toolchain install stable --profile minimal --component clippy
      - name: lint
        run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --manifest-path rust/Cargo.toml --workspace
      - name: release build
        run: cargo build --manifest-path rust/Cargo.toml --release -p anikit-cli
      - name: routes
        run: python e2e-smoke-tests/smoke.py rust/target/release/anikit.exe --out "$env:RUNNER_TEMP/smoke"

  windows-arm:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v5
      - name: toolchain
        run: rustup toolchain install stable --profile minimal --target aarch64-pc-windows-msvc
      - name: release build
        run: cargo build --manifest-path rust/Cargo.toml --release --target aarch64-pc-windows-msvc -p anikit-cli
      - name: routes
        shell: bash
        run: python e2e-smoke-tests/smoke.py rust/target/aarch64-pc-windows-msvc/release/anikit.exe --out "$RUNNER_TEMP/smoke"

  arm:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - name: toolchain
        run: rustup toolchain install stable --profile minimal --target aarch64-unknown-linux-musl
      - name: musl build
        run: cargo build --manifest-path rust/Cargo.toml --release --target aarch64-unknown-linux-musl -p anikit-cli
      - name: routes
        run: python3 e2e-smoke-tests/smoke.py rust/target/aarch64-unknown-linux-musl/release/anikit --out "$RUNNER_TEMP/smoke"
      - name: static link
        run: file rust/target/aarch64-unknown-linux-musl/release/anikit | grep -Eq "statically linked|static-pie linked"

  macos:
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: toolchain
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
      - name: build
        run: cargo build --manifest-path rust/Cargo.toml --release --target ${{ matrix.target }} -p anikit-cli
      - name: routes
        run: python3 e2e-smoke-tests/smoke.py rust/target/${{ matrix.target }}/release/anikit --out "$RUNNER_TEMP/smoke"
