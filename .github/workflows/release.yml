name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: anikit-linux-x86_64
            binary: rust/target/x86_64-unknown-linux-musl/release/anikit
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: anikit-windows-x86_64.exe
            binary: rust/target/x86_64-pc-windows-msvc/release/anikit.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
      - name: build
        run: cargo build --manifest-path rust/Cargo.toml --release --target ${{ matrix.target }} -p anikit-cli
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.binary }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" assets/* --verify-tag --generate-notes
