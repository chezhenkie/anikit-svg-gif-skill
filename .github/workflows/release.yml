name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: anikit-linux-x86_64
            binary: rust/target/x86_64-unknown-linux-musl/release/anikit
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: anikit-linux-arm
            binary: rust/target/aarch64-unknown-linux-musl/release/anikit
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: anikit-windows-x86_64.exe
            binary: rust/target/x86_64-pc-windows-msvc/release/anikit.exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            asset: anikit-windows-arm.exe
            binary: rust/target/aarch64-pc-windows-msvc/release/anikit.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: anikit-macos-arm
            binary: rust/target/aarch64-apple-darwin/release/anikit
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: toolchain
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
      - name: build
        run: cargo build --manifest-path rust/Cargo.toml --release --target ${{ matrix.target }} -p anikit-cli
      - name: stage
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.binary }}" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: bundles
        shell: bash
        run: |
          for asset in dist/anikit-*; do
            python3 tools/make_bundle.py \
              --binary "$asset" \
              --asset "$(basename "$asset")" \
              --tag "$GITHUB_REF_NAME" \
              --out dist
          done
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "anikit $GITHUB_REF_NAME" \
            --notes "One binary with six routes: ascii, images, vector and tween render animation, extract turns a GIF or APNG into frames and a manifest, and import turns an animated SVG into the timeline. Output is GIF, APNG and an SVG export from the tween route. The skill bundle (anikit-skill-<version>-<platform>.zip) is the easy route: extract the anikit folder into your agent's skills folder and it is installed. The loose anikit-* binaries are the manual route: clone the repository for SKILL.md and the references, put the binary in agent-skill/bin, then copy that folder. See CHANGELOG.md for the change list."
