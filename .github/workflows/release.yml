name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: anikit-linux-x86_64
            binary: rust/target/x86_64-unknown-linux-musl/release/anikit
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: anikit-linux-aarch64
            binary: rust/target/aarch64-unknown-linux-musl/release/anikit
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: anikit-windows-x86_64.exe
            binary: rust/target/x86_64-pc-windows-msvc/release/anikit.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: anikit-macos-aarch64
            binary: rust/target/aarch64-apple-darwin/release/anikit
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: anikit-macos-x86_64
            binary: rust/target/x86_64-apple-darwin/release/anikit
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
      - name: build
        run: cargo build --manifest-path rust/Cargo.toml --release --target ${{ matrix.target }} -p anikit-cli
      - name: stage
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.binary }}" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "anikit $GITHUB_REF_NAME" \
            --notes "One binary with four routes: ascii, images, vector and tween. Download the asset for the platform and install it as bin/anikit (bin/anikit.exe on Windows). See CHANGELOG.md for the change list."
